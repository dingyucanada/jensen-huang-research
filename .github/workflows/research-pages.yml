name: Publish reviewed research pages
on:
  push:
    paths:
      - 'observatory/**'
      - '.github/workflows/research-pages.yml'
  workflow_dispatch:
permissions: {}
concurrency:
  group: research-pages
  cancel-in-progress: false
jobs:
  package:
    if: github.ref_name == github.event.repository.default_branch && vars.ENABLE_RESEARCH_PAGES == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/research.py check
          python3 scripts/observatory.py check
          python3 -m unittest discover -s tests -v
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: observatory
  deploy:
    needs: package
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved default-branch snapshot
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
