name: Validate research
on:
  pull_request:
  push:
  merge_group:
permissions:
  contents: read
jobs:
  validate:
    name: Evidence, links and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/research.py check
      - run: python3 scripts/observatory.py check
      - run: python3 -m unittest discover -s tests -v
      - run: |
          node --check observatory/app.js
          node --check observatory/charts.js
